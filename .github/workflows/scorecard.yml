name: OpenSSF Scorecard

# Runs the OpenSSF Scorecard on a weekly cadence and on pushes to main.
# Results are uploaded to GitHub code scanning (Security tab) so that
# regressions in supply-chain posture are visible alongside CodeQL findings.
#
# Docs: https://github.com/ossf/scorecard-action

on:
  branch_protection_rule:
    types: [created, edited, deleted]
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday 04:23 UTC
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 7

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: scorecard-results.sarif
